{% extends "base.html" %}{% block title %}Ventes — AFRIVA{% endblock %}{% block heading %}Ventes{% endblock %}{% block content %}<div class="toolbar"><button onclick="loadSales()">Actualiser</button></div><div id="msg"></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Date</th><th>Commercial</th><th>Statut</th><th>Total</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Chargement…</td></tr></tbody></table></div>{% endblock %}{% block scripts %}<script>function loadSales(){fetch('/api/sales').then(r=>r.ok?r.json():Promise.reject()).then(d=>{rows.innerHTML=d.items.length?d.items.map(s=>`<tr><td>${s.id}</td><td>${s.sold_at?new Date(s.sold_at).toLocaleString('fr-FR'):'—'}</td><td>${s.commercial_id||'—'}</td><td>${s.status}</td><td>${Number(s.total_amount).toLocaleString('fr-FR',{minimumFractionDigits:2})} €</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Aucune vente.</td></tr>'}).catch(()=>msg.innerHTML='<div class="error">Impossible de charger les ventes.</div>')}loadSales();</script>{% endblock %}
