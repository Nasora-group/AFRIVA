<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — AFRIVA</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3ff,#f8fafc);font-family:Inter,system-ui,sans-serif;color:#172033}.card{width:min(430px,92%);background:#fff;padding:38px;border-radius:22px;box-shadow:0 18px 50px rgba(23,32,51,.12)}.brand{font-weight:800;letter-spacing:.12em;color:#3157d5;font-size:13px}h1{margin:10px 0 28px}label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #dce2ec;border-radius:10px;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;font-size:15px;cursor:pointer}.error{padding:11px;border-radius:9px;background:#fff0f0;color:#a22;margin-bottom:15px;font-size:14px}
    </style>
</head>
<body><main class="card"><span class="brand">AFRIVA SAAS</span><h1>Connexion</h1>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Se connecter</button></form></main></body>
</html>
