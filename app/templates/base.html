<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AFRIVA{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172033;font-family:Inter,system-ui,-apple-system,sans-serif}.layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#172033;color:#fff;padding:24px 16px}.brand{font-weight:900;letter-spacing:.12em;margin:4px 10px 24px}.nav a{display:block;color:#cbd3e2;text-decoration:none;padding:11px 12px;border-radius:9px;margin:3px 0}.nav a:hover,.nav a.active{background:#3157d5;color:#fff}.logout{border:0;background:transparent;color:#cbd3e2;padding:11px 12px;cursor:pointer;font:inherit;width:100%;text-align:left}.main{padding:30px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.top h1{margin:0 0 5px}.muted{color:#687386}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:20px}.card h3{margin:0 0 8px}.value{font-size:28px;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.button,button{border:0;border-radius:9px;background:#3157d5;color:#fff;padding:10px 14px;cursor:pointer}.button.secondary,button.secondary{background:#e8ecf5;color:#172033}.field{padding:10px;border:1px solid #d8dee9;border-radius:8px;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid #e4e8ef;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 13px;border-bottom:1px solid #edf0f5;text-align:left;white-space:nowrap}.table th{background:#f8f9fc}.status{font-weight:700}.error{background:#fff0f0;color:#a52828;padding:12px;border-radius:9px;margin:12px 0}.success{background:#edf9f0;color:#19733a;padding:12px;border-radius:9px;margin:12px 0}.empty{padding:30px;text-align:center;color:#687386}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.form-grid label{display:flex;flex-direction:column;gap:6px;font-weight:600}.form-grid input,.form-grid select,.form-grid textarea{padding:10px;border:1px solid #d8dee9;border-radius:8px;font:inherit}.form-grid textarea{min-height:90px}.module-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.module-links a{display:block;color:inherit;text-decoration:none}.module-links .card:hover{border-color:#3157d5}.small{font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{min-height:auto}.nav{display:flex;flex-wrap:wrap}.nav a,.logout{width:auto}.main{padding:18px}}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="layout">
<aside class="side">
<div class="brand">AFRIVA</div>
<nav class="nav">
<a href="{{ url_for('web.dashboard') }}">Dashboard</a>
<a href="{{ url_for('web.crm') }}">CRM</a>
<a href="{{ url_for('web.sales') }}">Ventes</a>
<a href="{{ url_for('web.pos') }}">POS / Caisse</a>
<a href="{{ url_for('web.stock') }}">Stock</a>
<a href="{{ url_for('web.billing') }}">Billing</a>
<a href="{{ url_for('web.analytics') }}">Analytics</a>
</nav>
<form method="post" action="{{ url_for('web.logout') }}"><button class="logout" type="submit">Déconnexion</button></form>
</aside>
<main class="main">
<div class="top"><div><h1>{% block heading %}AFRIVA{% endblock %}</h1><div class="muted">{{ organization.name }}</div></div><div class="muted">{{ user.first_name or user.email }}</div></div>
{% block content %}{% endblock %}
</main>
</div>
{% block scripts %}{% endblock %}
</body></html>
