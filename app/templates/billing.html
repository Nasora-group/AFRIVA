{% extends "base.html" %}{% block title %}Billing — AFRIVA{% endblock %}{% block heading %}Billing{% endblock %}{% block content %}<div class="grid"><div class="card"><h3>Abonnement</h3><div class="value" id="sub">—</div><div class="muted" id="period"></div></div><div class="card"><h3>Factures</h3><div class="value" id="invoices">—</div></div><div class="card"><h3>Plans disponibles</h3><div class="value" id="plans">—</div></div></div><div class="card" style="margin-top:18px"><h3>Plans</h3><div id="planList" class="grid"></div><div id="msg"></div></div>{% endblock %}{% block scripts %}<script>Promise.all([fetch('/api/v1/billing/plans'),fetch('/api/v1/billing/subscription')]).then(async rs=>{if(rs.some(r=>!r.ok))throw 0;return Promise.all(rs.map(r=>r.json()))}).then(([p,s])=>{plans.textContent=p.items.length;invoices.textContent='—';sub.textContent=s.subscription?s.subscription.plan:'Aucun';period.textContent=s.subscription?s.subscription.status:'';planList.innerHTML=p.items.map(x=>`<div class="card"><h3>${x.name}</h3><p>${x.description||''}</p><strong>${x.monthly_price.toLocaleString('fr-FR')} €/mois</strong><p class="small">${x.max_users} utilisateurs · ${x.max_stores} magasins · ${x.max_products} produits</p></div>`).join('')}).catch(()=>msg.innerHTML='<div class="error">Impossible de charger Billing.</div>');</script>{% endblock %}
