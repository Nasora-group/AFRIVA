{% extends "base.html" %}{% block title %}Analytics — AFRIVA{% endblock %}{% block heading %}Analytics{% endblock %}{% block content %}<div class="toolbar"><button onclick="load('all')">Tout</button><button class="secondary" onclick="load('month')">Ce mois</button><button class="secondary" onclick="load('year')">Cette année</button></div><div id="msg"></div><div class="grid"><div class="card"><h3>CA</h3><div class="value" id="revenue">—</div></div><div class="card"><h3>Ventes</h3><div class="value" id="sales">—</div></div><div class="card"><h3>Clients</h3><div class="value" id="clients">—</div></div><div class="card"><h3>Prospections</h3><div class="value" id="prospections">—</div></div></div>{% endblock %}{% block scripts %}<script>function load(period){fetch('/api/v1/analytics/summary?period='+period).then(r=>r.ok?r.json():Promise.reject()).then(d=>{revenue.textContent=Number(d.revenue||0).toLocaleString('fr-FR',{minimumFractionDigits:2})+' €';sales.textContent=d.sales_count;clients.textContent=d.clients;prospections.textContent=d.prospections;msg.innerHTML='<div class="success">Données actualisées.</div>'}).catch(()=>msg.innerHTML='<div class="error">Impossible de charger les analytics.</div>')}load('all');</script>{% endblock %}
