{% extends "base.html" %}{% block title %}POS — AFRIVA{% endblock %}{% block heading %}POS / Caisse{% endblock %}{% block content %}<div class="grid"><div class="card"><h3>Magasins</h3><div class="value" id="stores">—</div></div><div class="card"><h3>Caisses</h3><div class="value" id="registers">—</div></div><div class="card"><h3>Sessions</h3><div class="value" id="sessions">—</div></div></div><div class="card" style="margin-top:18px"><h3>Sessions de caisse</h3><div id="msg"></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Caisse</th><th>Statut</th><th>Ouverture</th><th>Clôture</th></tr></thead><tbody id="rows"></tbody></table></div></div>{% endblock %}{% block scripts %}<script>Promise.all([fetch('/api/pos/stores'),fetch('/api/pos/registers'),fetch('/api/pos/sessions')]).then(async rs=>{if(rs.some(r=>!r.ok))throw 0;return Promise.all(rs.map(r=>r.json()))}).then(([a,b,c])=>{stores.textContent=a.items.length;registers.textContent=b.items.length;sessions.textContent=c.items.length;rows.innerHTML=c.items.length?c.items.map(s=>`<tr><td>${s.id}</td><td>${s.register_id}</td><td>${s.status}</td><td>${Number(s.opening_cash).toLocaleString('fr-FR',{minimumFractionDigits:2})} €</td><td>${Number(s.closing_cash).toLocaleString('fr-FR',{minimumFractionDigits:2})} €</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Aucune session.</td></tr>'}).catch(()=>msg.innerHTML='<div class="error">Impossible de charger le POS.</div>');</script>{% endblock %}
