{% extends "base.html" %}{% block title %}Stock — AFRIVA{% endblock %}{% block heading %}Stock{% endblock %}{% block content %}<div class="grid"><div class="card"><h3>Produits</h3><div class="value" id="products">—</div></div><div class="card"><h3>Magasins</h3><div class="value" id="stores">—</div></div><div class="card"><h3>Articles en stock</h3><div class="value" id="stockCount">—</div></div></div><div class="card" style="margin-top:18px"><h3>Ajustement de stock</h3><form id="adjust" class="form-grid"><label>Produit<select name="product_id" id="product"></select></label><label>Magasin<select name="store_id" id="store"></select></label><label>Quantité<input name="quantity" type="number" step="0.001" required></label><label>Type<select name="movement_type"><option value="adjustment">Ajustement</option><option value="in">Entrée</option><option value="out">Sortie</option></select></label><label style="grid-column:1/-1">Note<textarea name="note"></textarea></label><div><button>Enregistrer</button></div></form><div id="msg"></div></div>{% endblock %}{% block scripts %}<script>Promise.all([fetch('/api/sales/products'),fetch('/api/pos/stores')]).then(async rs=>{if(rs.some(r=>!r.ok))throw 0;return Promise.all(rs.map(r=>r.json()))}).then(([p,s])=>{products.textContent=p.items.length;stores.textContent=s.items.length;product.innerHTML=p.items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');store.innerHTML=s.items.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}).catch(()=>msg.innerHTML='<div class="error">Impossible de charger les données de stock.</div>');adjust.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(adjust);fetch('/api/v1/inventory/movements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}).then(r=>r.ok?r.json():r.json().then(x=>Promise.reject(x.error||'Erreur'))).then(()=>msg.innerHTML='<div class="success">Mouvement enregistré.</div>').catch(e=>msg.innerHTML='<div class="error">'+e+'</div>')});</script>{% endblock %}
