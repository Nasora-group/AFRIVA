name: AFRIVA CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afriva
          POSTGRES_PASSWORD: afriva_test
          POSTGRES_DB: afriva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afriva -d afriva_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://afriva:afriva_test@localhost:5432/afriva_test
      TEST_DATABASE_URL: postgresql://afriva:afriva_test@localhost:5432/afriva_test
      SESSION_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Flake8
        run: flake8 app tests
      - name: Black check
        run: black --check app tests
      - name: isort check
        run: isort --check-only app tests
