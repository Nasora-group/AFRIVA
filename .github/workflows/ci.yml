name: AFRIVA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==23.7.0 isort==5.12.0
      - name: Format source and tests
        run: |
          black app tests
          isort app tests
      - name: Commit formatting fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git commit -m "style: apply Black and isort formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test-and-lint:
    needs: format
    if: always() && (needs.format.result == 'success' || needs.format.result == 'skipped')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afriva
          POSTGRES_PASSWORD: afriva_test
          POSTGRES_DB: afriva_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U afriva -d afriva_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://afriva:afriva_test@localhost:5432/afriva_test
      TEST_DATABASE_URL: postgresql://afriva:afriva_test@localhost:5432/afriva_test
      SESSION_COOKIE_SECURE: "false"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
      - name: Verify package import
        run: python -c "import app; print('AFRIVA app import OK:', app.__file__)"
      - name: Verify repository layout
        run: |
          test -f app/__init__.py
          test -f tests/test_phase3_integration.py
      - name: Prepare PostgreSQL RLS test roles
        run: |
          PGPASSWORD=afriva_test psql -h localhost -U afriva -d afriva_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE afriva_app LOGIN PASSWORD 'afriva_app_test' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
      - name: Run tests
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Flake8
        run: python -m flake8 app tests
      - name: Black check
        run: python -m black --check app tests
      - name: isort check
        run: python -m isort --check-only app tests
