name: Black diagnostic

on:
  push:
    branches:
      - phase6/pos

jobs:
  black-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==23.7.0
      - name: Show Black diff
        run: python -m black --diff app/routes/pos.py || true
